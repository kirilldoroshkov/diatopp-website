name: Resolve Zone FTPS hostname

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ftps.yml"

permissions:
  contents: read

jobs:
  resolve-host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve web server and reverse DNS
        shell: bash
        run: |
          set -euo pipefail
          echo "DNS chain:"
          dig +short www.diatopp.ee
          ip="$(dig +short A diatopp.ee | grep -E '^[0-9]+(\.[0-9]+){3}$' | head -n 1)"
          test -n "$ip"
          echo "Server IP: $ip"
          echo "Reverse DNS:"
          dig +short -x "$ip"
