name: Test Zone FTPS connection

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ftps.yml"

permissions:
  contents: read

jobs:
  test-ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect and list deployment directory
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          curl --fail --silent --show-error \
            --ssl-reqd \
            --ftp-pasv \
            --connect-timeout 20 \
            --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only \
            "ftp://tll07.zoneas.eu/"
          echo "FTPS connection and directory access succeeded."
