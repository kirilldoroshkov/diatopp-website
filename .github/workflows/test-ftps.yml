name: Diagnose Zone FTPS certificate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ftps.yml"

permissions:
  contents: read

jobs:
  diagnose-ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read FTP server certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl s_client -starttls ftp -connect www.diatopp.ee:21 -servername www.diatopp.ee </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -ext subjectAltName
